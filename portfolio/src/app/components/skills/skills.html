
<section id="skills" class="section skills-section">

  <div class="section-heading">

    <h2>
      {{ 'skills.title' | translate }}
    </h2>

  </div>

  <div class="skills-grid">

    @for (category of skillCategories; track category.id) {

      <div class="skill-category">

        <h3>
          {{ category.title | translate }}
        </h3>

        <div class="skill-list">

          @for (skill of category.items; track skill.name) {

            <div class="skill-item">

              <div class="skill-item-header">

                <span class="skill-icon">
                  &lt;/&gt;
                </span>

                <span class="skill-name">
                  {{ skill.name }}
                </span>

                @if (skill.level) { 
                  <span
                    class="skill-level"
                    [class.level-basic]="skill.level === 'skills.levels.basic'"
                    [class.level-intermediate]="skill.level === 'skills.levels.intermediate'"
                    [class.level-advanced]="skill.level === 'skills.levels.advanced'"
                    [class.level-specialized]="skill.level === 'skills.levels.specialized'"
                  >
                    {{ skill.level | translate }}
                  </span>
                }

              </div>

            </div>

          }

        </div>

      </div>

    }

  </div>

</section>
